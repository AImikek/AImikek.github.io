<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DUA NDA Signer Log</title>
  <style>
    :root { --ink:#0f2028; --paper:#f4f1ea; --surface:#fffdf8; --muted:#65747a; --line:#d9d5ca; --accent:#b9d83a; --danger:#a63d36; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; }
    main { width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:56px 0; }
    .eyebrow { font:700 11px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.14em; text-transform:uppercase; color:#667b16; }
    h1 { margin:10px 0 8px; font:400 clamp(34px,5vw,58px)/1.05 Georgia,serif; letter-spacing:-.045em; }
    .sub { margin:0; color:var(--muted); max-width:680px; line-height:1.55; }
    .card { margin-top:34px; background:var(--surface); border:1px solid var(--line); box-shadow:0 20px 50px rgba(15,32,40,.06); }
    #login { width:min(420px,100%); padding:32px; }
    label { display:block; margin:20px 0 8px; font-size:13px; font-weight:700; }
    input { width:100%; padding:13px 14px; border:1px solid #b7beb9; border-radius:2px; background:#fff; font:inherit; }
    button, .download { border:0; border-radius:2px; padding:12px 16px; background:var(--ink); color:#fff; font:700 13px/1 ui-sans-serif,system-ui,sans-serif; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    button:hover, .download:hover { background:#243b45; } button.secondary { color:var(--ink); background:#e8e6df; } button.danger { color:var(--danger); background:transparent; border:1px solid #c99792; }
    .error { min-height:20px; margin-top:14px; color:var(--danger); font-size:13px; }
    #dashboard { display:none; } .toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:22px 24px; border-bottom:1px solid var(--line); }
    .count { font:700 14px ui-monospace,SFMono-Regular,monospace; } .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:850px; } th,td { padding:16px 20px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; } th { background:#f0eee7; color:var(--muted); font:700 10px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.09em; text-transform:uppercase; } td { font-size:14px; } td strong { display:block; font-size:14px; } td span { color:var(--muted); font-size:12px; } .empty { padding:56px 24px; color:var(--muted); text-align:center; }
    @media (max-width:640px) { main { width:min(100% - 28px,1180px); padding:32px 0; } .toolbar { padding:18px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Confidential · DUA Hotel</div>
    <h1>NDA signer log</h1>
    <p class="sub">Review recorded proposal acknowledgments. This dashboard is private and not indexed by search engines.</p>

    <section class="card" id="login">
      <form id="login-form">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" style="margin-top:18px">Sign in</button>
        <div class="error" id="login-error" role="alert"></div>
      </form>
    </section>

    <section class="card" id="dashboard">
      <div class="toolbar">
        <div class="count" id="count">0 records</div>
        <div class="actions">
          <button class="secondary" id="refresh" type="button">Refresh</button>
          <a class="download" href="/api/admin/acknowledgments.csv">Export CSV</a>
          <button class="danger" id="logout" type="button">Sign out</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Recorded (UTC)</th><th>Signer</th><th>Role / company</th><th>Terms</th><th>Record</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const login = document.getElementById('login');
    const dashboard = document.getElementById('dashboard');
    const error = document.getElementById('login-error');
    const records = document.getElementById('records');
    const count = document.getElementById('count');

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const response = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ password: document.getElementById('password').value }) });
      if (!response.ok) { error.textContent = (await response.json()).error || 'Unable to sign in.'; return; }
      login.style.display = 'none'; dashboard.style.display = 'block'; loadRecords();
    });
    document.getElementById('refresh').addEventListener('click', loadRecords);
    document.getElementById('logout').addEventListener('click', async () => { await fetch('/api/admin/logout', {method:'POST'}); location.reload(); });

    async function loadRecords() {
      const response = await fetch('/api/admin/acknowledgments');
      if (response.status === 401) { login.style.display = 'block'; dashboard.style.display = 'none'; return; }
      const data = await response.json();
      const entries = data.acknowledgments || [];
      count.textContent = `${entries.length} ${entries.length === 1 ? 'record' : 'records'}`;
      records.innerHTML = entries.length ? entries.map(row).join('') : '<tr><td class="empty" colspan="5">No NDA acknowledgments have been recorded yet.</td></tr>';
    }
    function row(entry) {
      return `<tr><td>${escapeHtml(new Date(entry.acknowledgedAt).toISOString().replace('T',' ').replace('.000Z',' UTC'))}</td><td><strong>${escapeHtml(entry.name)}</strong><span>${escapeHtml(entry.email)}</span></td><td>${escapeHtml(entry.role || '—')}</td><td><strong>${escapeHtml(entry.termsVersion)}</strong><span>Proposal ${escapeHtml(entry.proposalVersion)}</span></td><td><span>${escapeHtml(entry.id)}</span></td></tr>`;
    }
    function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    loadRecords();
  </script>
</body>
</html>
