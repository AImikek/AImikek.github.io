<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer">
<title>Private notes</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1d232b;--muted:#5d6670;--line:#dcd9d1;--accent:#1f5f4a;--soft:#eef3f0}
@media (prefers-color-scheme: dark){:root{--bg:#14171b;--surface:#1b1f24;--ink:#e7e9ec;--muted:#9aa3ad;--line:#2c323a;--accent:#7cc4a8;--soft:#1f2a26}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px}
.gate h1{font-size:1.15rem;margin:0 0 6px}.gate p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.gate input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
.err{color:#b3261e;font-size:.9rem;min-height:1.2em;margin-top:8px}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
header.top h1{font-size:1.4rem;margin:0}header.top .meta{color:var(--muted);font-size:.88rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.bar a,.bar button{font:inherit;font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.92rem;margin-bottom:18px}
nav.toc ol{margin:0 0 20px;padding-left:20px}nav.toc li{margin:2px 0}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 12px;margin:0 0 16px}
section h2{font-size:1.1rem;margin:12px 0 8px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td a{overflow-wrap:anywhere}
li{margin:4px 0}
</style></head>

</form></div>

<script>
(function(){
  const V = JSON.parse(document.getElementById("pv").textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  async function open(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(V.s), iterations:V.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(V.i)}, key, b64(V.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function render(D){
    const app = document.getElementById("app");
    const toc = D.sections.map((s) => '<li><a href="#' + s.id + '">' + esc(s.title) + '</a></li>').join("");
    app.innerHTML = '<header class="top"><h1>' + esc(D.title) + '</h1><span class="meta">Updated ' + esc(D.updated) + '</span></header>' +
      '<div class="bar"><a href="/4910/">Back to the brief</a><button type="button" id="lock">Lock</button><button type="button" id="forget">Hide the link on this computer</button></div>' +
      '<div class="note">Only you have this page\'s password. Nothing here is in the shared brief, the Drive folder or the brief\'s question box, so the lawyers never see it.</div>' +
      '<nav class="toc"><ol>' + toc + '</ol></nav>' +
      D.sections.map((s) => '<section id="' + s.id + '"><h2>' + esc(s.title) + '</h2>' + s.html + '</section>').join("");
    document.getElementById("gate").hidden = true; app.hidden = false;
    document.getElementById("lock").onclick = () => { location.reload(); };
    document.getElementById("forget").onclick = (ev) => { try { localStorage.removeItem("ph4910-private-url"); } catch (e) {} ev.target.textContent = "Link hidden on this computer (keep this page bookmarked)"; ev.target.disabled = true; };
    if (location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault(); const err = document.getElementById("err"); const go = document.getElementById("go");
    err.textContent = ""; go.disabled = true; go.textContent = "Opening...";
    try { const D = await open(document.getElementById("pw").value); document.getElementById("pw").value = "";
      try { localStorage.setItem("ph4910-private-url", location.pathname); } catch (x) {}
      render(D);
    } catch (x) { err.textContent = "That password didn't work."; }
    go.disabled = false; go.textContent = "Open";
  });
})();
</script>
