<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PH4910 Tenant Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="brief-css">/* Layout D: a numbered legal memo. Contents column on the left (sticky, highlights the section
   in view), one reading column with a bottom line and deadline strip first, then folding
   sections; a sticky bar names the section being read. Court-green accent, semantic amber/red. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --fg:#1B1D21; --muted:#5B5F66; --line:#DADAD4;
  --accent:#1F5D4C; --accent-fg:#FFFFFF; --accent-soft:#E0EDE8; --drive:#1F5E99;
  --due:#9B5810; --due-soft:#FAEDDA; --crit:#A33A2A; --crit-soft:#F8E4E0; --ok:#2A7549; --ok-soft:#E0F0E6;
  --c-lease:#6A58A6; --c-repairs:#AE4F2B; --c-money:#11706A; --c-disputes:#A33A2A; --c-building:#7F6A14; --c-tender:#1F5E99;
  --scrim:rgba(0,0,0,.45);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101211; --surface:#171A19; --surface-2:#1C201F; --fg:#E7E8E4; --muted:#A1A59F; --line:#2C302E;
    --accent:#7DC4AC; --accent-fg:#101211; --accent-soft:#163029; --drive:#88B9EB;
    --due:#E6A65C; --due-soft:#33250F; --crit:#EC8C7C; --crit-soft:#3A1F1A; --ok:#7BC79A; --ok-soft:#15301F;
    --c-lease:#AA9DE2; --c-repairs:#E79C7A; --c-money:#62C4B8; --c-disputes:#EC8C7C; --c-building:#D6C066; --c-tender:#88B9EB;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101211; --surface:#171A19; --surface-2:#1C201F; --fg:#E7E8E4; --muted:#A1A59F; --line:#2C302E;
  --accent:#7DC4AC; --accent-fg:#101211; --accent-soft:#163029; --drive:#88B9EB;
  --due:#E6A65C; --due-soft:#33250F; --crit:#EC8C7C; --crit-soft:#3A1F1A; --ok:#7BC79A; --ok-soft:#15301F;
  --c-lease:#AA9DE2; --c-repairs:#E79C7A; --c-money:#62C4B8; --c-disputes:#EC8C7C; --c-building:#D6C066; --c-tender:#88B9EB;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}

/* base */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.55;margin:0;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
strong{font-weight:650}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.m-wrap,#gate{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{font:inherit;font-size:.9rem;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost,.btn.secondary{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover,.btn.secondary:hover{border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.86rem}
.btn[disabled]{opacity:.55;cursor:default}
input[type=search],input[type=password],input[type=text]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}

/* gate */
#gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:48px}
.gate-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.gate-card h1{font-family:var(--f-display);font-weight:600;font-size:1.7rem;margin:6px 0}
.gate-card p{color:var(--muted);font-size:.95rem;margin:0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:.85rem;color:var(--muted)}
.field input{width:100%}
.err{color:var(--crit);font-size:.9rem;margin-top:8px;min-height:1.2em}

/* header */
.m-progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:40}
.m-progress span{display:block;height:100%;width:0;background:var(--accent)}
.m-wrap{max-width:1240px;margin:0 auto;padding-block:36px 10px}
.m-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.1rem,4.4vw,3rem);letter-spacing:-.015em;margin:8px 0 0;line-height:1.05}
.m-sub{color:var(--muted);margin:10px 0 0}
.m-prep{color:var(--muted);font-size:.9rem;margin:6px 0 0;max-width:90ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.toolbar .status{font-size:.88rem;color:var(--muted)}

/* layout: contents column + memo */
.m-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;align-items:start;margin-top:8px}
.m-main{min-width:0;max-width:880px}
.m-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-top:30px;padding-bottom:12px}
.m-nav ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.m-nav a[data-id]{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;padding:6px 10px;border-radius:0 6px 6px 0;color:var(--fg);text-decoration:none;font-size:.9rem;line-height:1.3;border-left:2px solid transparent}
.m-nav a[data-id] .n{font-family:var(--f-display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.m-nav a[data-id]:hover{background:var(--accent-soft)}
.m-nav a[data-id].on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.m-nav a[data-id].on .n{color:var(--accent)}
.m-nav a.dim{opacity:.4}
.m-navfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:.88rem;padding-left:12px}
.m-navfoot .btn{font-size:.82rem;padding:5px 9px}
.m-navfoot a{flex:1 1 100%;margin-top:2px}
.m-navchips{margin-top:12px;padding-left:12px}
.m-nav .legend{padding-left:12px}

/* bottom line and deadlines */
.m-bottom{margin-top:28px;border-top:2px solid var(--fg);padding:16px 0 4px}
.m-bottom h2{font-family:var(--f-display);font-size:1.35rem;font-weight:600;margin:0 0 10px}
.m-bottom ol{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:9px;font-size:1.02rem}
.m-bottom li::marker{font-family:var(--f-display);font-weight:600;color:var(--accent)}
.m-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:20px}
.m-dl{display:flex;flex-direction:column;gap:1px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--tone);border-radius:6px;background:var(--surface);min-width:0}
.tone-crit{--tone:var(--crit)} .tone-due{--tone:var(--due)} .tone-calm{--tone:var(--accent)} .tone-muted{--tone:var(--muted)}
.m-count{font-weight:650;color:var(--tone);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em}
.m-dlt{font-weight:600}
.m-when{color:var(--muted);font-size:.86rem}
.m-dls{font-size:.86rem;margin-top:6px}

/* sticky bar naming the section in view */
.m-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:26px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.m-where{flex:1 1 220px;min-width:0;display:flex;gap:10px;align-items:baseline;white-space:nowrap;overflow:hidden}
.m-wnum{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:1.15rem;font-variant-numeric:tabular-nums}
.m-wtitle{font-family:var(--f-display);font-weight:600;font-size:1.12rem;overflow:hidden;text-overflow:ellipsis;min-width:0}
.m-where.idle .m-wtitle{color:var(--muted);font-family:var(--f-body);font-size:.92rem;font-weight:500}
.m-fold.off{visibility:hidden}
.m-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m-tools input[type=search]{width:220px}
.m-tools select{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);max-width:230px;display:none}
.m-resline{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.m-resline:empty{display:none}

/* folding sections */
details.m-sec{border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--bar-h,64px) + 8px)}
details.m-sec>summary{list-style:none;display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:12px;padding:18px 0;cursor:pointer;align-items:start}
details.m-sec>summary::-webkit-details-marker{display:none}
details.m-sec>summary:hover .m-title{color:var(--accent)}
.m-num{font-family:var(--f-display);font-size:1.35rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.m-title{display:block;font-family:var(--f-display);font-size:1.32rem;font-weight:600;line-height:1.22}
.m-sum{display:block;color:var(--muted);margin-top:4px;font-size:.96rem;max-width:68ch}
.m-chev::after{content:"";display:block;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:9px}
details[open]>summary .m-chev::after{transform:rotate(-135deg);margin-top:14px}
.m-body{padding:0 0 24px 52px;min-width:0}

/* section content */
.content{overflow-wrap:break-word;min-width:0}
.content p{margin:0 0 .9em;max-width:72ch}
.content h3{font-family:var(--f-display);font-size:1.12rem;font-weight:600;margin:22px 0 8px}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.callout p{max-width:none}
.callout.warn{background:var(--due-soft);border-left-color:var(--due)}
.content ol,.content ul{padding-left:1.3em}
ol.q{display:flex;flex-direction:column;gap:8px}
.sec-body[contenteditable="true"],p[data-tl][contenteditable="true"]{outline:2px dashed var(--accent);outline-offset:6px;border-radius:4px;background:var(--surface)}
.tblwrap{overflow-x:auto;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line);overflow-wrap:break-word}
.tbl td a{overflow-wrap:anywhere}
.tbl th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl.parties{min-width:640px;table-layout:fixed}
.tbl.parties th:nth-child(1),.tbl.parties th:nth-child(2){width:21%}
.content .tbl:not(.parties) th:first-child{width:24%}
.tbl.ledger{min-width:780px;table-layout:fixed}
.content .tbl.ledger th:first-child{width:11%}
.tbl.ledger th:nth-child(2){width:26%}
.tbl.ledger th:nth-child(3){width:12%}
.tbl.ledger th:nth-child(4){width:11%}
.tbl.ledger th:nth-child(5){width:14%}
.tbl.ledger td[colspan]{background:var(--surface-2);padding-top:12px}
.tbl.ev td:first-child{width:60%}
a.lnk{display:inline-block;white-space:nowrap;font-size:.8rem;font-weight:600;text-decoration:none;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--drive);margin:2px 2px 2px 0;line-height:1.55;vertical-align:baseline}
a.lnk:hover{border-color:var(--drive)}
a.lnk::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--drive);margin-right:6px;vertical-align:1px}
a.lnk.gmail{color:var(--muted)} a.lnk.gmail::before{background:var(--muted)}
a.lnk.file{color:var(--ok)} a.lnk.file::before{background:var(--ok)}
a.lnk.ext{color:var(--fg)} a.lnk.ext::before{background:var(--fg)}
.legend{font-size:.85rem;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

/* timeline */
.c-lease{--cat:var(--c-lease)} .c-repairs{--cat:var(--c-repairs)} .c-money{--cat:var(--c-money)}
.c-disputes{--cat:var(--c-disputes)} .c-building{--cat:var(--c-building)} .c-tender{--cat:var(--c-tender)} .c-all{--cat:var(--fg)}
.tx-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 6px}
.tx-cats{display:flex;flex-wrap:wrap;gap:6px}
.tx-bar input[type=search]{width:min(100%,260px)}
.fchip{font:inherit;font-size:.84rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cat)}
.fchip.c-all::before{display:none}
.fchip.on{border-color:var(--cat);background:color-mix(in srgb,var(--cat) 14%,var(--surface))}
.fchip .cnt{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tline{list-style:none;margin:0;padding:0}
.tmonth{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:18px 0 6px}
.titem{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.tdate{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.tcat{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--cat)}
.tcat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cat)}
.tbody p{margin:3px 0 0}
.tbody .links{margin-top:4px}
.tx-empty{color:var(--muted)}

/* evidence */
.evgroup h3{font-family:var(--f-display);font-size:1.08rem;font-weight:600;margin:22px 0 6px}
details.emails{margin-top:20px} details.emails summary{cursor:pointer;font-weight:650}

/* ask about this case */
.ask{margin-top:24px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:var(--surface);padding:14px 16px 12px}
.ask-head{display:flex;flex-direction:column;gap:4px}
.ask-form{display:flex;gap:8px;margin-top:10px}
.ask-form input{flex:1 1 240px;min-width:0}
.ask-item{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ask-q{font-weight:600}
.ask-a p{margin:.45em 0 0;max-width:none}
.ask-a .thinking{color:var(--muted);font-style:italic}
.ask-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.ask-foot .legend:empty{display:none}
.ask-foot:empty{display:none}
@media (max-width:640px){.ask-form{flex-wrap:wrap}.ask-form .btn{flex:1 1 auto}}
/* footer and edit UI */
.m-foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.95rem;z-index:50;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:45;padding:16px}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(100%,440px)}
.modal .card h2{font-family:var(--f-display);font-weight:600;margin:0 0 8px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

@media (prefers-reduced-motion:no-preference){.m-chev::after{transition:transform .15s ease}html{scroll-behavior:smooth}}
@media (max-width:820px){
  .m-layout{grid-template-columns:1fr;gap:0}
  .m-nav{display:none}
  .m-tools select{display:inline-block}
}
@media (max-width:640px){
  body{font-size:16px}
  .m-wrap{padding-block:26px 10px}
  .m-bar{gap:6px 8px;padding-block:8px}
  .m-where{flex:1 1 0}
  .m-fold{padding:5px 9px;font-size:.82rem}
  .m-tools{flex:1 1 100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .m-tools input[type=search],.m-tools select{width:100%;max-width:none;min-width:0}
  .m-body{padding-left:0}
  details.m-sec>summary{grid-template-columns:28px minmax(0,1fr) 16px;gap:10px}
  .m-title{font-size:1.18rem}
  .titem{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="eyebrow">Private working file</div>
    <h1>PH4910 Tenant Brief</h1>
    <p>This brief is encrypted. Enter the password Mike gave you to open it.</p>
    <div class="field"><label for="gatePw">Password</label><input type="password" id="gatePw" name="pw" autocomplete="current-password" required></div>
    <div class="err" id="gateErr" aria-live="polite"></div>
    <div class="field"><button class="btn" type="submit">Open the brief</button></div>
  </form>

<script id="brief-app">(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k);
    return e;
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- crypto (AES-GCM, key from PBKDF2-SHA256) ----------
  const te = new TextEncoder(), td = new TextDecoder();
  // chunked: the vault is megabytes now that files ride inside it, and spreading that many
  // arguments into String.fromCharCode overflows the call stack
  const b64 = (buf) => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function deriveKey(pw, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function decryptVault(vault, pw) {
    const key = await deriveKey(pw, unb64(vault.salt), vault.iterations);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(vault.iv) }, key, unb64(vault.ct));
    return JSON.parse(td.decode(plain));
  }
  async function encryptVault(data, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const iterations = 310000;
    const key = await deriveKey(pw, salt, iterations);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(data)));
    return { v: 1, kdf: "PBKDF2-SHA256", iterations, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
  }

  // ---------- state ----------
  let DATA = null, PW = null, vault = JSON.parse($("#vault").textContent);
  let editing = false, artifactNs = null, canEdit = false;
  const root = $("#root");

  const GH = { owner: "AImikek", repo: "AImikek.github.io", path: "4910/index.html", branch: "main" };
  const GH_KEY = "ph4910-gh-token";
  const insideClaude = !!(window.claude && typeof window.claude.use === "function");
  let ghToken = null; try { ghToken = localStorage.getItem(GH_KEY) || null; } catch (e) {}

  }
  async function publishToGitHub(html) {
    const base = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;

    else if (g.status === 401 || g.status === 403) { const e = new Error("token rejected"); e.code = "not_granted"; throw e; }

    pb.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + "%";
    trackMemo();
  }, { passive: true });

  // ---------- Ask about this case ----------
  // A question box for the reader. The answer comes from Claude reading the whole decrypted
  // brief (sections, timeline, evidence index) with fixed instructions: answer only from the
  // brief, cite where, no assessment of its own. Two routes: inside claude.ai the page uses
  // the viewer's own Claude (the "sample" capability); on mikek.ai it calls a small proxy
  // whose address and shared secret travel inside the encrypted vault (DATA.ask), so only
  // people who can open the brief can use it. Nothing is stored on this page or the proxy.
  const ASK_INSTRUCTIONS = `You are the assistant built into the PH4910 Tenant Brief, a working file prepared for Michael (Mike) Krilivsky, the tenant of PH4910 at 1300 S Miami Avenue, Miami, for his attorneys. The full brief follows between <brief> tags.

Rules.
1. Answer only from the brief. Quote or closely paraphrase it, and say where the answer sits: the section number and title, the timeline date, and the exhibit codes the brief uses (E045, G11, T17, R01 and so on).
2. If the brief does not contain the answer, say so in one sentence and name the section, or the person (Mike, his agent, the escrow company, building management), most likely to have it. Never guess, infer, or fill gaps with general knowledge; never invent dates, amounts, names or documents.
3. You are a finding aid, not an advocate and not an adversary. Do not add your own assessment of the strength or weakness of any claim, defense or position; do not raise risks or problems the brief does not itself state; do not give legal advice or strategy. Where the brief itself records a limit, caveat or candor note on a point, relay it in the brief's own words when it is responsive.
4. Keep answers short, in plain prose, in the reader's language. Plain text only: no Markdown, no asterisks, no headings, no bullet lists unless the reader asks for a list. Dollar amounts and dates exactly as the brief gives them.

  let sampleFn = null, askTurns = [], askCtl = null, caseTextCache = null;
  function htmlToText(html) {
    const box = document.createElement("div"); box.innerHTML = html;
    box.querySelectorAll("script,style").forEach((n) => n.remove());
    box.querySelectorAll("a.lnk").forEach((a) => a.replaceWith("[" + a.textContent.trim() + "]"));
    box.querySelectorAll("td,th").forEach((c) => c.append(" | "));
    box.querySelectorAll("tr,p,h2,h3,h4,li,div").forEach((e) => e.append("\n"));

  }
  function caseText() {
    if (caseTextCache) return caseTextCache;

    parts.push("SECTION " + (DATA.sections.length + 1) + ". TIMELINE\n" + DATA.timeline.map(([d, t, links]) => d + ": " + t + (links && links.length ? " [" + links.map((l) => l[2]).join(", ") + "]" : "")).join("\n"));
    parts.push("SECTION " + (DATA.sections.length + 2) + ". EVIDENCE INDEX\n" + DATA.evidenceGroups.map((g) => g.title + ":\n" + g.items.map((it) => "- " + it[0]).join("\n")).join("\n") +
      "\nEmail exhibits (code, date, from, subject):\n" + DATA.emails.map((e) => e.code + " " + e.date + " " + e.from + ": " + e.subject + (e.note ? " (" + e.note + ")" : "")).join("\n"));

  }
  function askMode() {

  }

  async function askSample(turns, onText, signal) {
    const input = [{ role: "user", content: ASK_INSTRUCTIONS + "\n\n<brief>\n" + caseText() + "\n</brief>" }, ...turns];
    const { text } = await sampleFn(input, { cache: false, signal, onText: ({ text }) => onText(text) });
    return text;
  }
  function codeLinks() {
    const map = {};
    $$("a.lnk").forEach((a) => { const m = a.textContent.trim().match(/^([A-Z]\d{2,3}[a-c]?)(?:\s|$)/); if (m && !map[m[1]]) map[m[1]] = a.dataset.file ? "evidence/" + encodeURIComponent(a.dataset.file) : a.getAttribute("href"); });

  }
  function renderAnswer(box, text, done) {
    const links = done ? codeLinks() : null;
    box.innerHTML = "";
    const paras = text.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    if (!paras.length) { box.append(el("p", { class: "thinking" }, "Thinking...")); return; }
    for (const p0 of paras) {

    if (done) linkFiles(box);
  }
  function askBox() {
    const mode = askMode();

    }
    const head = el("div", { class: "ask-head" }, el("span", { class: "eyebrow" }, "Ask about this case"),
      el("span", { class: "legend" }, "Answers come only from this brief and its sealed files, with the section and exhibit to check. They are not legal advice. Questions are not saved on this page" + (mode === "proxy" ? " or on Mike's server" : "") + "."));
    const input = el("input", { type: "text", id: "ask-q", autocomplete: "off", placeholder: "e.g. When did the landlord first refuse the money, and what proves it?", "aria-label": "Your question" });

    const note = el("span", { class: "legend" });
    foot.append(clearBtn, note);
    sec.append(head, form, log, foot);
    askTurns.forEach((t, i) => { if (t.role === "user") { const item = el("div", { class: "ask-item" }, el("div", { class: "ask-q" }, t.content), el("div", { class: "ask-a" })); const a = askTurns[i + 1]; if (a) renderAnswer($(".ask-a", item), a.content, true); log.append(item); } });
    clearBtn.hidden = !askTurns.length;
    clearBtn.addEventListener("click", () => { askTurns = []; log.innerHTML = ""; clearBtn.hidden = true; note.textContent = ""; });
    stopBtn.addEventListener("click", () => { if (askCtl) askCtl.abort(); });
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const q = input.value.trim(); if (!q || askCtl) return;
      input.value = ""; note.textContent = "";
      const item = el("div", { class: "ask-item" }, el("div", { class: "ask-q" }, q), el("div", { class: "ask-a" }));
      const out = $(".ask-a", item); log.append(item); renderAnswer(out, "", false);
      const turns = [...askTurns.slice(-8), { role: "user", content: q }];
      askCtl = new AbortController(); askBtn.disabled = true; stopBtn.hidden = false;
      let text = "";
      try {
        const run = mode === "sample" ? askSample : askProxy;
        text = await run(turns, (t) => { text = t; renderAnswer(out, t, false); }, askCtl.signal);
        askTurns = [...turns, { role: "assistant", content: text }];
      } catch (e) {
        const code = e && e.code;
        if (code === "cancelled" || (e && e.name === "AbortError")) { if (text) askTurns = [...turns, { role: "assistant", content: text }]; else item.remove(); note.textContent = text ? "Stopped." : ""; }
        else if (code === "not_granted" || code === "sampling_disabled") { item.remove(); note.textContent = "Claude is not allowed for this page in your account, so the question box is off."; sec.querySelector(".ask-form").hidden = true; }
        else if (code === "rate_limited") { item.remove(); note.textContent = "Too many questions for now. Try again in a few minutes."; }
        else { if (!text) text = ""; renderAnswer(out, text || "", true); note.textContent = "The assistant could not answer: " + ((e && (e.message || e.code)) || "unknown error") + (mode === "proxy" ? " If this keeps happening, tell Mike." : ""); if (!text) item.remove(); }
      } finally {
        if (text) renderAnswer(out, text, true);
        askCtl = null; askBtn.disabled = false; stopBtn.hidden = true; clearBtn.hidden = !askTurns.length;
        input.focus();
      }
    });
    return sec;
  }

  // ---------- gate ----------
  const gate = $("#gate");
  async function tryUnlock(pw, silent) {
    try {
      DATA = await decryptVault(vault, pw);
      PW = pw;
      try { sessionStorage.setItem("ph4910-pw", pw); } catch (e) {}
      materializeFiles();
      gate.hidden = true; root.hidden = false;
      render();
      initCapabilities();
    } catch (e) {
      if (!silent) $("#gateErr").textContent = "That password did not unlock the brief. Check capitals and dashes.";
    }
  }
  $("#gateForm").addEventListener("submit", (ev) => { ev.preventDefault(); tryUnlock($("#gatePw").value, false); });
  function lock() {
    if (askCtl) { try { askCtl.abort(); } catch (e) {} }
    askTurns = []; caseTextCache = null;
    try { sessionStorage.removeItem("ph4910-pw"); } catch (e) {}
    revokeFiles();
    DATA = null; PW = null; root.hidden = true; root.innerHTML = ""; gate.hidden = false; $("#gatePw").value = ""; $("#gatePw").focus();
  }
  try { const saved = sessionStorage.getItem("ph4910-pw"); if (saved) tryUnlock(saved, true); } catch (e) {}

  // ---------- capabilities (edit + publish) ----------
  let capsInit = false;
  async function initCapabilities() {
    if (capsInit) return; capsInit = true;
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [a, u, smp] = await Promise.all([window.claude.use("artifact"), window.claude.use("user"), window.claude.use("sample")]);
      artifactNs = a; sampleFn = (typeof smp === "function") ? smp : null;
      canEdit = !!(a && u && u.canEdit && u.canEdit());
    } catch (e) { canEdit = false; }
    if (DATA) render();
  }

  function toast(msg, ms = 3200) {
    const t = el("div", { class: "toast", role: "status" }, msg); document.body.append(t); setTimeout(() => t.remove(), ms);
  }
  function sanitize(html) {
    const box = document.createElement("div"); box.innerHTML = html;
    box.querySelectorAll("script,style,iframe,object,embed").forEach((n) => n.remove());
    box.querySelectorAll("*").forEach((n) => {
      [...n.attributes].forEach((at) => { if (/^on/i.test(at.name) || (at.name === "href" && /^\s*javascript:/i.test(at.value))) n.removeAttribute(at.name); });
      if (n.tagName === "A") {
        if (n.dataset.file) { n.setAttribute("href", "evidence/" + n.dataset.file); n.removeAttribute("data-file"); n.removeAttribute("data-file-bound"); }
        else if (/^blob:/i.test(n.getAttribute("href") || "")) n.removeAttribute("href");
        n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener");
      }
    });
    return box.innerHTML;
  }
  function toggleEdit() {
    editing = !editing;
    if (editing) document.querySelectorAll("details.m-sec").forEach((d) => { d.open = true; });
    document.querySelectorAll(".sec-body").forEach((b) => b.setAttribute("contenteditable", editing ? "true" : "false"));
    document.querySelectorAll("p[data-tl]").forEach((b) => b.setAttribute("contenteditable", editing ? "true" : "false"));
    const btn = $("#editBtn"), st = $("#status");
    if (editing) {
      btn.textContent = "Save";
      const cancel = el("button", { type: "button", class: "btn ghost", id: "cancelBtn", onclick: () => { editing = false; render(); } }, "Cancel");
      btn.after(cancel);
      st.textContent = "Editing. Click into any section or timeline entry and type. Links can be added as plain URLs. Save publishes a new version for everyone.";
    } else {
      save();
    }
  }
  async function save() {
    const btn = $("#editBtn"); btn.disabled = true; $("#status").textContent = "Saving...";
    document.querySelectorAll(".sec-body").forEach((b) => { const s = DATA.sections.find((x) => x.id === b.dataset.sec); if (s) s.html = sanitize(b.innerHTML); });
    document.querySelectorAll("p[data-tl]").forEach((p) => { const i = Number(p.dataset.tl); if (DATA.timeline[i]) DATA.timeline[i][1] = p.textContent; });
    DATA.meta.saved = new Date().toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" });
    try {
      await publishSelf();
      toast(insideClaude ? "Saved. A new version of the page is live." : "Saved to GitHub. mikek.ai shows the new version within a minute or two.", 5000);
      render();
    } catch (e) {
      const code = e && e.code;
      if (code === "conflict") { toast(insideClaude ? "Someone saved a newer version first. Reloading to it." : "The page on GitHub changed since this one loaded. Copy your edits, reload, and redo them.", 6000); btn.disabled = false; $("#status").textContent = "Save failed."; }
      else if (code === "not_writer" || code === "not_granted") { if (insideClaude) { canEdit = false; toast("This view is read-only, so the change was not saved."); render(); } else { toast("GitHub rejected the token (expired, or no write access). Turn editing off and on again with a fresh token.", 6000); btn.disabled = false; $("#status").textContent = "Save failed."; } }
      else { toast("Could not save (" + (code || (e && e.message) || "unknown") + "). Your edits are still on screen; copy them before leaving."); btn.disabled = false; $("#status").textContent = "Save failed."; }
    }
  }
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function pageParts(newVault) {
    const css = $("#brief-css").textContent;
    const fl = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis.com"]');
    const fontHref = (fl && fl.getAttribute("href")) || "https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap";
    const js = $("#brief-app").textContent;
    const gc = $("#gate").cloneNode(true); gc.removeAttribute("hidden"); gc.querySelectorAll("input").forEach((i) => { i.value = ""; i.removeAttribute("value"); }); const ge = gc.querySelector("#gateErr"); if (ge) ge.textContent = "";
    const head = `<title>${esc(DATA.meta.title)}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="${esc(fontHref)}">\n<style id="brief-css">${css}</style>\n`;
    const markup = `${gc.outerHTML}\n<div id="root" hidden></div>\n<script type="application/json" id="vault">${JSON.stringify(newVault).replace(/<\//g, "<\\/")}</scr` + `ipt>\n<script id="brief-app">${js}</scr` + `ipt>\n`;

  }
