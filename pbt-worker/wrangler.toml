# PB Tourney assistant + payments worker.
# Cloudflare "Deploy from GitHub" (Workers Builds) deploys this folder on every push to main.
name = "bitter-dawn-bb19"
main = "worker.js"
compatibility_date = "2026-10-14"
# All variables and secrets are managed in the Cloudflare dashboard (Settings → Variables and Secrets):
# ANTHROPIC_API_KEY, ALLOWED_UIDS, MODEL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FIREBASE_SERVICE_ACCOUNT, FIREBASE_DB_URL.
# keep_vars stops a deploy from wiping them.
keep_vars = true
