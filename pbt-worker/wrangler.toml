# PB Tourney assistant + payments worker.
# Cloudflare "Deploy from GitHub" (Workers Builds) deploys this folder on every push to main.
name = "bitter-dawn-bb19"
main = "worker.js"
compatibility_date = "2026-10-14"

# Plain variables live HERE (a deploy re-applies them every time).
# SECRETS live in the dashboard only (Settings -> Variables and Secrets -> type Secret) and are never touched by a deploy:
#   ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FIREBASE_SERVICE_ACCOUNT
keep_vars = true
[vars]
ALLOWED_UIDS = "all"
MODEL = "claude-sonnet-5-5"
FIREBASE_DB_URL = "https://pickle-tourney-default-rtdb.firebaseio.com"
